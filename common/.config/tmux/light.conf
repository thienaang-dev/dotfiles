set -g @bg0         '#f2ecbc'
set -g @bg1         '#e7dba0'
set -g @bg2         '#e4d794'
set -g @bg3         '#e5ddb0'
set -g @bg4         '#dcd5ac'
set -g @fg          '#545464'
set -g @red         '#c84053'
set -g @yellow      '#77713f'
set -g @green       '#6f894e'
set -g @blue        '#c7d7e0'
set -g @purple      '#a09cac'
set -g @aqua        '#597b75'
set -g @orange      '#cc6d00'
set -g @grey0       '#8a8980'
set -g @grey1       '#716e61'
set -g @statusline1 '#4d699b'
set -g @statusline2 '#223249'

# ---- General Settings ----
set-option -g status "on"
set -g status-interval 2

set-option -g status-fg '#545464' # fg
set-option -g status-bg '#f2ecbc' # bg0

set-option -g mode-style fg='#{@purple}',bg='#{@bg2}'

# default statusbar colors
set-option -g status-style fg='#{@fg}',bg='#{@bg0}',default

# ---- Windows ----
# default window title colors
set-window-option -g window-status-style fg='#{@bg4}',bg='#{@bg1}'

# default window with an activity alert
set-window-option -g window-status-activity-style 'bg=#{@bg2},fg=#{@bg4}'

# active window title colors (Using Gruvbox Green)
set-window-option -g window-status-current-style fg='#{@bg0}',bg='#{@green}'

# ---- Pane ----
# pane borders
set-option -g pane-border-style fg='#{@bg2}'
set-option -g pane-active-border-style 'fg=#{@blue}'

# pane number display
set-option -g display-panes-active-colour '#c7d7e0' # blue
set-option -g display-panes-colour '#cc6d00' # orange

# ---- Command ----
# message info
set-option -g message-style fg='#{@statusline2}',bg='#{@bg1}'

# writing commands inactive
set-option -g message-command-style 'fg=#{@bg3},bg=#{@bg1}'
#
# ---- Miscellaneous ----
# clock
set-window-option -g clock-mode-colour '#c7d7e0' # blue

# bell
set-window-option -g window-status-bell-style fg='#{@bg0}',bg='#{@statusline2}'

# ---- Formatting ----
set-option -g status-left-style none
set -g status-left-length 60
# bg here is statusline1, fg is the dark bg0 for contrast
set -g status-left "#[fg=#d5cea3,bg=#4d699b] #S "

set-option -g status-right-style none
set -g status-right-length 150
set -g status-right ''

set -g window-status-separator ''
set -g window-status-format "#[fg=#{@grey0},bg=#{@bg0}] #I | #[fg=#{@grey0},bg=#{@bg0}]#W "
set -g window-status-current-format "#[fg=#{@grey1},bg=#{@bg3}] #I | #[fg=#{@grey1},bg=#{@bg3},bold,italics]#W "
