## COLORSCHEME: Everforest Light (medium)

set -g @everforest_bg_dim '#efebd4'
set -g @everforest_bg0 '#fdf6e3'
set -g @everforest_bg1 '#f4f0d9'
set -g @everforest_bg2 '#eae4ca'
set -g @everforest_bg3 '#e0dcc7'
set -g @everforest_bg4 '#d6d3c0'
set -g @everforest_bg5 '#cfc9b2'

set -g @everforest_bg_visual '#eae4ca'
set -g @everforest_bg_red '#fbe3da'
set -g @everforest_bg_green '#f0f1d2'
set -g @everforest_bg_blue '#e9f0e9'
set -g @everforest_bg_yellow '#faedcd'

set -g @everforest_fg '#5c6a72'
set -g @everforest_red '#f85552'
set -g @everforest_orange '#f57d26'
set -g @everforest_yellow '#dfa000'
set -g @everforest_green '#8da101'
set -g @everforest_aqua '#35a77c'
set -g @everforest_blue '#3a94c5'
set -g @everforest_purple '#df69ba'

set -g @everforest_grey0 '#a6b0a0'
set -g @everforest_grey1 '#939f91'
set -g @everforest_grey2 '#829181'

set -g @everforest_statusline1 '#8da101'
set -g @everforest_statusline2 '#5c6a72'
set -g @everforest_statusline3 '#f85552'

set-option -g status "on"
set -g status-interval 2

set-option -g status-fg '#5c6a72' # fg
set-option -g status-bg '#fdf6e3' # bg0

set-option -g mode-style fg='#{@everforest_purple}',bg='#{@everforest_bg_red}' 

# default statusbar colors
set-option -g status-style fg='#{@everforest_fg}',bg='#{@everforest_bg_dim}',default 

# ---- Windows ----
# default window title colors
set-window-option -g window-status-style fg='#{@everforest_bg5}',bg='#{@everforest_bg0}' 

# default window with an activity alert
set-window-option -g window-status-activity-style 'bg=#{@everforest_bg1},fg=#{@everforest_bg3}' 

# active window title colors
set-window-option -g window-status-current-style fg='#{@everforest_fg}',bg='#{@everforest_bg_green}' 

# ---- Pane ----
# pane borders
set-option -g pane-border-style fg='#{@everforest_bg1}' 
set-option -g pane-active-border-style 'fg=#{@everforest_blue}' 

# pane number display
set-option -g display-panes-active-colour '#3a94c5' # blue
set-option -g display-panes-colour '#f57d26' # orange

# ---- Command ----
# message info
set-option -g message-style fg='#{@everforest_statusline3}',bg='#{@everforest_bg_dim}' 

# writing commands inactive
set-option -g message-command-style 'fg=#{@everforest_bg3},bg=#{@everforest_bg1}' 

# ---- Miscellaneous ----
# clock
set-window-option -g clock-mode-colour '#3a94c5' #blue

# bell
set-window-option -g window-status-bell-style fg='#{@everforest_bg0}',bg='#{@everforest_statusline3}' 

# ---- Formatting ----
set-option -g status-left-style none
set -g status-left-length 60
# bg here is everforest_green, fg is the dark bg0_hard for contrast on the tag
set -g status-left "#[fg=#5c6a72,bg=#8da101,bold] #S #[fg=#8da101,bg=#5c6a72,nobold,nounderscore,noitalics]"

set-option -g status-right-style none
set -g status-right-length 150
set -g status-right ' '

set -g window-status-separator '#[fg=#{@everforest_grey2},bg=#{@everforest_bg0}] '
set -g window-status-format "#[fg=#{@everforest_grey0},bg=#{@everforest_bg0}] #I  #[fg=#{@everforest_grey0},bg=#{@everforest_bg0}]#W "
set -g window-status-current-format "#[fg=#{@everforest_bg0},bg=#{@everforest_bg_green}]#[fg=#{@everforest_fg},bg=#{@everforest_bg_green}] #I  #[fg=#{@everforest_fg},bg=#{@everforest_bg_green},bold]#W #[fg=#{@everforest_bg_green},bg=#{@everforest_bg0},nobold]"

