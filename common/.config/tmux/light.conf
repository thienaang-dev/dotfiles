set -g @bg_dim      '#f2e5bc'
set -g @bg0         '#f2e5bc'
set -g @bg1         '#ebdbb2'
set -g @bg2         '#d5c4a1'
set -g @bg3         '#bdae93'
set -g @bg4         '#a89984'
set -g @bg_red      '#db4733'
set -g @bg_yellow   '#b57614'
set -g @bg_green    '#79740e'
set -g @bg_blue     '#076678'
set -g @bg_purple   '#8f3f71'
set -g @bg_visual   '#e1d5b3'
set -g @fg          '#3c3836'
set -g @red         '#9d0006'
set -g @yellow      '#b57614'
set -g @green       '#79740e'
set -g @blue        '#076678'
set -g @purple      '#8f3f71'
set -g @aqua        '#427b58'
set -g @orange      '#af3a03'
set -g @grey0       '#a89984'
set -g @grey1       '#928374'
set -g @grey2       '#7c6f64'
set -g @statusline1 '#7c6f64'
set -g @statusline2 '#d5c4a1'
set -g @statusline3 '#79740e'

# ---- General Settings ----
set-option -g status "on"
set -g status-interval 2

set-option -g status-fg '#3c3836' # fg
set-option -g status-bg '#f2e5bc' # bg0

set-option -g mode-style fg='#{@purple}',bg='#{@bg2}' 

# default statusbar colors
set-option -g status-style fg='#{@fg}',bg='#{@bg_dim}',default 

# ---- Windows ----
# default window title colors
set-window-option -g window-status-style fg='#{@bg4}',bg='#{@bg1}' 

# default window with an activity alert
set-window-option -g window-status-activity-style 'bg=#{@bg2},fg=#{@bg4}' 

# active window title colors (Using Gruvbox Green)
set-window-option -g window-status-current-style fg='#{@bg0}',bg='#{@green}' 

# ---- Pane ----
# pane borders
set-option -g pane-border-style fg='#{@bg2}' 
set-option -g pane-active-border-style 'fg=#{@blue}' 

# pane number display
set-option -g display-panes-active-colour '#076678' # blue
set-option -g display-panes-colour '#af3a03' # orange

# ---- Command ----
# message info
set-option -g message-style fg='#{@statusline3}',bg='#{@bg1}' 

# writing commands inactive
set-option -g message-command-style 'fg=#{@bg3},bg=#{@bg1}' 
#
# ---- Miscellaneous ----
# clock
set-window-option -g clock-mode-colour '#076678' # blue

# bell
set-window-option -g window-status-bell-style fg='#{@bg0}',bg='#{@statusline3}' 

# ---- Formatting ----
set-option -g status-left-style none
set -g status-left-length 60
# bg is green, fg is the light bg0 for contrast
set -g status-left "#[fg=#f2e5bc,bg=#79740e,bold] #S #[fg=#79740e,bg=#f2e5bc,nobold,nounderscore,noitalics]"

set-option -g status-right-style none
set -g status-right-length 150
set -g status-right ' '

set -g window-status-separator '#[fg=#{@grey2},bg=#{@bg0}] '
set -g window-status-format "#[fg=#{@grey0},bg=#{@bg0}] #I  #[fg=#{@grey0},bg=#{@bg0}]#W "
set -g window-status-current-format "#[fg=#{@bg_dim},bg=#{@statusline1}]#[fg=#{@bg0},bg=#{@statusline1}] #I  #[fg=#{@bg0},bg=#{@statusline1},bold]#W #[fg=#{@statusline1},bg=#{@bg0},nobold]"
