set -g @bg_dim      '#16161d'
set -g @bg0         '#1f1f28'
set -g @bg1         '#181820'
set -g @bg2         '#1a1a22'
set -g @bg3         '#2a2a37'
set -g @bg4         '#363646'
set -g @bg_visual   '#2d4f67'
set -g @fg          '#dcd7ba'
set -g @red         '#c34043'
set -g @yellow      '#dca561'
set -g @green       '#76946a'
set -g @blue        '#7e9cd8'
set -g @purple      '#957fb8'
set -g @aqua        '#6a9589'
set -g @orange      '#ffa066'
set -g @grey0       '#727169'
set -g @grey1       '#938aa9'
set -g @statusline1 '#7e9cd8'
set -g @statusline2 '#658594'

# ---- General Settings ----
set-option -g status "on"
set -g status-interval 2

set-option -g status-fg '#dcd7ba' # fg
set-option -g status-bg '#1f1f28' # bg0

set-option -g mode-style fg='#{@purple}',bg='#{@bg2}'

# default statusbar colors
set-option -g status-style fg='#{@fg}',bg='#{@bg0}',default

# ---- Windows ----
# default window title colors
set-window-option -g window-status-style fg='#{@bg4}',bg='#{@bg0}'

# default window with an activity alert
set-window-option -g window-status-activity-style 'bg=#{@bg1},fg=#{@bg3}'

# active window title colors
set-window-option -g window-status-current-style fg='#{@fg}',bg='#{@bg_visual}'

# ---- Pane ----
# pane borders
set-option -g pane-border-style fg='#{@bg1}'
set-option -g pane-active-border-style 'fg=#{@blue}'

# pane number display
set-option -g display-panes-active-colour '#7e9cd8' # blue
set-option -g display-panes-colour '#ffa066' # orange

# ---- Command ----
# message info
set-option -g message-style fg='#{@statusline2}',bg='#{@bg_dim}'

# writing commands inactive
set-option -g message-command-style 'fg=#{@bg3},bg=#{@bg1}'

# ---- Miscellaneous ----
# clock
set-window-option -g clock-mode-colour '#7e9cd8' # blue

# bell
set-window-option -g window-status-bell-style fg='#{@bg0}',bg='#{@statusline3}'

# ---- Formatting ----
set-option -g status-left-style none
set -g status-left-length 60
# bg here is statusline1, fg is the dark bg0 for contrast
set -g status-left "#[fg=#16161d,bg=#7e9cd8,bold] #S "

set-option -g status-right-style none
set -g status-right-length 150
set -g status-right ''

set -g window-status-separator ''
set -g window-status-format "#[fg=#{@grey0},bg=#{@bg0}] #I | #[fg=#{@grey0},bg=#{@bg0}]#W "
set -g window-status-current-format "#[fg=#{@grey1},bg=#{@bg3}] #I | #[fg=#{@grey1},bg=#{@bg3},bold,italics]#W "
