metadata:
  os: "macOS"

tasks:
  - name: "Homebrew"
    description: "Install homebrew - package manager for macOS"
    command: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    reboot-required: false

  - name: "Directories"
    description: "Setup necessary directories"
    command: mkdir -p ~/repositories/{builds,projects,learning}
    reboot-required: false

  - name: "Packages"
    description: "Setup all necessary packages for development"
    command: |
      brew install git gh stow tmux node openjdk gcc make ripgrep fd unzip tmuxinator &&
      brew install --cask ghostty
    reboot-required: true

  - name: "Neovim"
    description: "Setup Neovim - text editor"
    command: |
      brew install ninja cmake gettext curl git tree-sitter-cli &&
      cd ~/repositories/builds &&
      git clone https://github.com/neovim/neovim &&
      cd neovim &&
      git checkout stable &&
      make CMAKE_BUILD_TYPE=Release &&
      sudo make install
    reboot-required: false

  - name: "Zsh"
    description: "Setup zsh shell"
    command: |
      brew install zsh &&
      chsh -s /opt/homebrew/bin/zsh &&
      rm -rf $HOME/.zshrc
    reboot-required: true

  - name: "starship"
    description: "Setup starship (prompt)"
    command:  -sS https://starship.rs/install.sh | sh
    reboot-required: false

  - name: "antidote"
    description: "Setup antidote (zsh plugin manager)"
    command: git clone --depth=1 https://github.com/mattmc3/antidote.git ${ZDOTDIR:-$HOME}/.antidote
    reboot-required: false

  - name: "Config"
    description: "Setup config files"
    command: |
      cd $HOME/dotfiles &&
      stow macos common &&
      git config --global user.name thienaang.dev &&
      git config --global user.email thienaang.dev@gmail.com
    reboot-required: true

  - name: "SSH"
    description: "Setup remote login"
    command: ssh-keygen -t ed25519 -C "thienaang.dev@gmail.com"
    reboot-required: true

  - name: "Docker Desktop"
    description: "Setup Docker Desktop"
    steps:
      1. Download via: https://docs.docker.com/desktop/setup/install/mac-install/
    reboot-required: true

  - name: "IntelliJ"
    description: "Setup JetBrains IntelliJ Community Edition"
    steps:
      1. Download via: https://www.jetbrains.com/idea/download/?section=linux
    reboot-required: true

  - name: "BetterDisplay"
    description: "Setup BetterDisplay"
    steps:
      1. Download via: https://betterdisplaymac.com/
    reboot-required: false
