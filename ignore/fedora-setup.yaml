metadata:
  os: "Fedora"
  hostname: "zendora"

tasks:
  - name: "System"
    description: "Ensure system is up to date"
    command: sudo dnf upgrade
    reboot-required: false

  - name: "Packages"
    description: "Setup all necessary packages for development"
    command: |
      sudo dnf -y install gh stow tmux nodejs java-25-openjdk npm neovim gcc make git ripgrep fd-find unzip &&
      sudo flatpak install -y postman spotify
    reboot-required: false

  - name: "Ghostty"
    description: "Setup Ghostty - terminal emulator"
    command: |
      sudo dnf copr enable scottames/ghostty &&
      sudo dnf install ghostty
    reboot-required: false

  - name: "Zsh"
    description: "Setup zsh shell"
    command: |
      sudo dnf install zsh &&
      chsh -s /usr/bin/zsh &&
      rm -rf $HOME/.zshrc
    reboot-required: true

  - name: "starship"
    description: "Setup starship (prompt)"
    command: curl -sS https://starship.rs/install.sh | sh
    reboot-required: false

  - name: "antidote"
    description: "Setup antidote (zsh plugin manager)"
    command: git clone --depth=1 https://github.com/mattmc3/antidote.git ${ZDOTDIR:-$HOME}/.antidote
    reboot-required: false

  - name: "Tmuxinator"
    description: "Setup tmuxinator"
    command: |
      sudo dnf -y install rubygems &&
      gem install tmuxinator
    reboot-required: false

  - name: "IntelliJ"
    description: "Setup JetBrains IntelliJ Community Edition"
    steps:
      1. Download via: https://www.jetbrains.com/idea/download/?section=linux
      2: Extract it
      3: Move it to /opt folder
      4: Run commands below
    command: |
      cd $HOME/Downloads &&
      sudo tar -xzf idea-*tar.gz -C /opt &&
      sudo mv /opt/idea-* /opt/idea
      cd /opt/idea/bin &&
      ./idea.sh
    reboot-required: true

  - name: "Config"
    description: "Setup config files"
    command: |
      cd $HOME/dotfiles &&
      stow fedora common &&
      git config --global user.name thienaang.dev &&
      git config --global user.email thienaang.dev@gmail.com
    reboot-required: true

  - name: "SSH"
    description: "Setup remote login"
    command: ssh-keygen -t ed25519 -C "thienaang.dev@gmail.com"
    reboot-required: true

  - name: "Docker Desktop"
    description: "Setup Docker Desktop"
    website: https://docs.docker.com/desktop/setup/install/linux/fedora/
    steps:
      - command: |
          sudo dnf -y install dnf-plugins-core &&
          sudo dnf-3 config-manager --add-repo https://download.docker.com/linux/fedora/docker-ce.repo &&
          curl https://desktop.docker.com/linux/main/amd64/docker-desktop-x86_64.rpm\?utm_source\=docker\&utm_medium\=webreferral\&utm_campaign\=docs-driven-download-linux-amd64\&_gl\=1\*iivorp\*_ga\*MjE1NzQxMDk1LjE3NjQwODg1NDA.\*_ga_XJWPQMJYHQ\*czE3NjQzOTkwOTAkbzQkZzEkdDE3NjQzOTkxNDYkajQkbDAkaDA. -o $HOME/Downloads/docker-desktop-x86_64.rpm &&
          sudo dnf -y install $HOME/Downloads/docker-desktop-x86_64.rpm
        sign-in:
          - generate-key: |
              gpg --generate-key
          - init-pass: |
              pass init
    reboot-required: false

  - name: "Brave"
    description: "Setup Brave browser"
    command: curl -fsS https://dl.brave.com/install.sh | sh
    reboot-required: false
